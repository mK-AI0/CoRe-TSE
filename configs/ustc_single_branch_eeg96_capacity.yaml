# 科学容量消融：原 TRUST 单分支流程，仅将 Stage-1 EEG 嵌入宽度改为 96。
# 音频投影同步改为 96 仅为保持 Stage-1 点积相似度的维度兼容；其余结构/损失不变。
eeg_hidden: 96
# USTC 2-second-window adaptation of TRUST-TSE defaults.
seed: 777
sample_rate: 16000
num_workers: 4
prefetch_factor: 2
torch_num_threads: 1
torch_num_interop_threads: 1
clip_grad_norm: 5.0
patience: 10
confidence_scale: 5.0
stage1_negative_mode: attended_same_trial

extractor:
  N: 256
  L: 20
  B: 64
  H: 128
  K: 100
  R: 6

stage1_lr: 0.0005
stage1_epochs: 50
trials_per_batch: 4
windows_per_trial: 8
stage1_eval_batch_size: 32

stage2_lr: 0.0003
stage2_epochs: 100
stage2_batch_size: 8
